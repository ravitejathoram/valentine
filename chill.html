<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kavya | Stop 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-pink: #ff758f; --dark-pink: #c9184a; --bg-gradient: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); }
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Quicksand', sans-serif; background: var(--bg-gradient); overflow: hidden; }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 3rem; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); text-align: center; width: 85%; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.4); position: relative; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--dark-pink); margin-bottom: 1rem; }
        p { color: #444; font-size: 1.1rem; line-height: 1.6; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn { padding: 12px 35px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-weight: 500; border: none; }
        .btn-yes { background: var(--primary-pink); color: white; box-shadow: 0 4px 15px rgba(255, 117, 143, 0.4); z-index: 2; }
        .btn-no { background: #eee; color: #888; transition: transform 0.8s cubic-bezier(.47,1.64,.41,.8), opacity 0.5s; z-index: 1; }
        .fly-away { transform: translate(600px, -600px) rotate(90deg); opacity: 0; pointer-events: none; }
        .clue-box { margin-top: 2rem; padding: 1.5rem; background: rgba(255, 117, 143, 0.1); border-radius: 20px; border: 2px dashed var(--primary-pink); text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card animate__animated animate__jackInTheBox">
        <div id="ask-section">
            <h1>Hi Kavya... ❤️</h1>
            <p>Do you wanna skip reality?</p>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="handleYes()">Yes!</button>
                <button id="no-btn" class="btn btn-no" onclick="alert('Feature Unavailable: Reality cannot be skipped with No.')">No</button>
            </div>
        </div>
        <div id="clue-section" class="hidden animate__animated animate__zoomIn">
            <h1>Stop 2</h1>
            <p>Lets go to a different dimension!</p>
        </div>
    </div>
    <script>
        function handleYes() {
            document.getElementById('no-btn').classList.add('fly-away');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => {
                document.getElementById('ask-section').classList.add('hidden');
                document.getElementById('clue-section').classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
